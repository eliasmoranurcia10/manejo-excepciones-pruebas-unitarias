version: "3.9"
services:
  java_app_products_ms:
    container_name: java_app_products_ms
    image: java-app-products-ms:1.0.0
    build: .
    ports:
      - "8083:8082"
    environment:
      - DATABASE_URL=jdbc:postgresql://java_db_products_ms:5432/productsdb
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=root
    depends_on:
      - java_db_products_ms

  java_db_products_ms:
    container_name: java_db_products_ms
    image: postgres:latest
    ports:
      - "5440:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
      POSTGRES_DB: productsdb
    volumes:
      - database:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "88:80"
    depends_on:
      - java_db_products_ms

volumes:
  database: